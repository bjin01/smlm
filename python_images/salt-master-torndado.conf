ext_pillar:
  - getsumagroups:
      pillar_file: /srv/pillar/sumagroups/init.sls

rest_tornado:
    # can be any port
    port: 8088
    # address to bind to (defaults to 0.0.0.0)
    address: 0.0.0.0
    # socket backlog
    backlog: 128
    ssl_crt: /etc/salt/pki/api/salt-api.crt
    # no need to specify ssl_key if cert and key
    # are in one single file
    ssl_key: /etc/salt/pki/api/salt-api.key
    debug: False
    disable_ssl: True
    webhook_disable_auth: False
    cors_origin: null
    websockets: True

external_auth:
  sharedsecret:
    mysalt:
      - .*
      - '@jobs'
      - '@runner'
      - '@wheel'
